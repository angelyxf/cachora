name: Prepare Cachora source beta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: python3 scripts/build-local-app.py
      - name: Export reviewed source archive
        run: python3 scripts/prepare-beta.py --source-archive
      - uses: actions/upload-artifact@v4
        with:
          name: cachora-source-beta
          path: build-local/*-source.zip
          retention-days: 14
# This workflow prepares an artifact only. It cannot publish a release,
# sign as an upstream author, modify a Homebrew tap or upload an unsigned app.
